name: ci

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  id-token: write   # mint the GitHub OIDC token used to assume the AWS role
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout ${{ github.sha }}
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Test, lint, build
        run: npx turbo test lint build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout ${{ github.sha }}
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npm run test:e2e
      # The HTML report includes a video of every test, plus traces for any failures
      - name: Upload Playwright report
        id: upload-report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          # Videos take up space, so only keep these briefly
          retention-days: 7
      - name: Link to Playwright report
        if: ${{ !cancelled() && steps.upload-report.outputs.artifact-url }}
        run: |
          echo "### 🎭 End-to-end test report" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download the report with test videos](${{ steps.upload-report.outputs.artifact-url }}) (kept for 7 days), unzip it and run \`npx playwright show-report <folder>\`." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: [build, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Avoid two deploys to the same CloudFormation stacks at once
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - name: Checkout ${{ github.sha }}
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      # Deployment prep — AWS access via GitHub OIDC federation (no stored keys).
      # Assumes the raise-ci role, which trusts this repo's master-ref OIDC token
      # and grants the same serverless-policy the old static-key user had.
      - name: "Configure AWS credentials (OIDC)"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::405129592067:role/raise-ci
          aws-region: eu-west-1

      # Deployment to dev environment
      - name: "server: Retrieve env for dev environment"
        run: echo "$DEV_ENV" > apps/server/src/env/dev.ts
        env:
          DEV_ENV: ${{ secrets.DEV_ENV }}
      - name: "Deploy to dev environment"
        run: npx turbo deploy:dev

      # Deployment to prod environment
      - name: "web: Deploy to prod environment"
        run: npx turbo deploy:prod --filter @raise/web
